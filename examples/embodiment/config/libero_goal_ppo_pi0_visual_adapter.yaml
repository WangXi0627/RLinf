defaults:
  - env/libero_goal@env.train
  - env/libero_goal@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  # Saves only parameters with requires_grad=True. This does not preserve
  # optimizer, scheduler, or RNG state for an exact resume.
  checkpoint_mode: trainable_only
  logger:
    log_path: "../results/pi0/visual_adapter_ppo"
    project_name: rlinf
    experiment_name: "libero_goal_pi0_fla_ftm_ppo"
    logger_backends: ["wandb"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 4
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    reward_coef: ${algorithm.reward_coef}
  eval:
    rollout_epoch: 1
    total_num_envs: 10
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 256
  seed: 42
  enable_offload: False
  model:
    model_path: "/data/Xixixi/VLA1/model_cache/openpi/openpi-assets/checkpoints/pi0_libero_pytorch"
    trainable_checkpoint_path: null
    num_action_chunks: 5
    add_value_head: True
    openpi:
      detach_critic_input: True
      train_expert_only: True
      train_action_expert: False
      train_action_head: False
      visual_adaptation:
        backbone:
          # Change only this value: none | fla | last_layer_adapter
          type: fla
          fla:
            rank: 16
            alpha: 16.0
            dropout: 0.0
            target_modules: [q_proj, k_proj, v_proj, out_proj]
          last_layer_adapter:
            bottleneck_dim: 64
            dropout: 0.0
            residual_scale: 1.0
        # Independent switch: valid with fla or last_layer_adapter.
        ftm:
          enabled: True
          init_gamma: 0.0
          init_beta: 0.0
  optim:
    lr: 1.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
