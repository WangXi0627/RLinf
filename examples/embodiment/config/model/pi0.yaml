model_type: "openpi"

# Model path - should be set in specific config files
model_path: "/path/to/model/openpi"
# Optional trainable-only weights loaded on top of model_path.
trainable_checkpoint_path: null

precision: null

# Action and chunk settings
num_action_chunks: 10
action_dim: 7

# LoRA settings
is_lora: False
lora_rank: 32

# Training settings
use_proprio: True
num_steps: 4
add_value_head: False

# openpi specific parameters
openpi:
  config_name: "pi0_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  # Explicit trainability switches. null preserves the legacy behavior.
  train_action_expert: null
  train_action_head: null

  # FLA and last_layer_adapter are alternative visual backbone adapters.
  # FTM is orthogonal and can be composed with either backbone choice.
  visual_adaptation:
    backbone:
      type: none  # none | fla | last_layer_adapter
      fla:
        rank: 16
        alpha: 16.0
        dropout: 0.0
        target_modules: [q_proj, k_proj, v_proj, out_proj]
      last_layer_adapter:
        bottleneck_dim: 64
        dropout: 0.0
        residual_scale: 1.0
    ftm:
      enabled: False
      init_gamma: 0.0
      init_beta: 0.0

  # Evaluation-only PCD Meta-Subspace overlay. The frozen Pi0 checkpoint is
  # loaded first; this checkpoint contributes only TaskEncoder/Demix/FiLM/Mask.
  meta_subspace:
    enabled: False
    checkpoint_path: null
    manifest_path: null
    feature_dir: null
    task_mapping_path: null
    base_config: "pi0_libero"
    support_size: 2
    support_seed: 7
    intervention_alpha: 0.25
    component_mode: "full"
    strict: True
    verify_artifact_hashes: True
    verify_base_identity: True
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  add_value_head: ${..add_value_head}
  detach_critic_input: False
  # DSRL specific configurations (disabled by default)
  use_dsrl: False
  dsrl_state_dim: 8
  dsrl_action_noise_dim: 32
  dsrl_num_q_heads: 10
  dsrl_agg_q: "mean"
  dsrl_image_latent_dim: 64
  dsrl_state_latent_dim: 64
  dsrl_hidden_dims: [128, 128, 128]
