defaults:
  - env/libero_object@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results/pi0/fla_eval"
    project_name: rlinf
    experiment_name: "pi0_libero_plus_object_fla"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    total_num_envs: 25
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    seed: 7
    num_steps_wait: 10
    plus_category: ${oc.env:LIBERO_CATEGORY}
    plus_classification_path: ${oc.env:LIBERO_CLASSIFICATION_PATH}
    plus_strict_manifest: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: "libero_10"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:OPENPI_CHECKPOINT}
    trainable_checkpoint_path: ${oc.env:SPATIAL_ADAPTATION_CHECKPOINT}
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 10
    add_value_head: False
    openpi:
      task: "eval"
      config_name: "pi0_libero"
      action_horizon: 50
      train_action_expert: False
      train_action_head: False
      visual_adaptation:
        backbone:
          type: fla
          fla:
            rank: 16
            alpha: 16.0
            dropout: 0.0
            target_modules: [fc1, fc2]
            expected_modules: 54
        ftm:
          enabled: False

